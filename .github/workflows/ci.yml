name: CI
on:
  push:
  workflow_dispatch:
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Theme Check
        run: npx --yes @shopify/cli@latest theme check --fail-level error
