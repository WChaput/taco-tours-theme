name: CI
on: [push]

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shopify/theme-check-action@v2 falla con el formato JSON actual del CLI ("e.filter is not a function")
      - name: Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error
